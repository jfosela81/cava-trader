name: Bot — Monthly Calibration Report

on:
  schedule:
    # Primer día de cada mes a las 09:00 CEST (07:00 UTC)
    - cron: '0 7 1 * *'
  workflow_dispatch:

permissions:
  contents: write  # necesario para hacer commit del .md al repo

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  monthly-report:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Call monthly-report API
        run: |
          HTTP_STATUS=$(curl -s -o response.json -w "%{http_code}" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "${{ secrets.BOT_BASE_URL }}/api/bot/monthly-report")

          echo "HTTP Status: $HTTP_STATUS"
          cat response.json

          if [ "$HTTP_STATUS" != "200" ]; then
            echo "❌ Error: HTTP $HTTP_STATUS"
            exit 1
          fi

      - name: Generate markdown report
        run: |
          MONTH=$(python3 -c "import json; print(json.load(open('response.json'))['month'])")
          echo "REPORT_MONTH=$MONTH" >> $GITHUB_ENV
          python3 scripts/generate_monthly_report.py response.json "reports/${MONTH}.md"

      - name: Commit and push report
        run: |
          git config user.name  "Cava Trader Bot"
          git config user.email "bot@cava-trader.noreply"
          git add reports/
          git diff --staged --quiet || git commit -m "report: calibración mensual ${{ env.REPORT_MONTH }}"
          git push

      - name: Summary
        run: |
          echo "✅ Informe guardado en:"
          echo "   → Supabase: tabla cava_monthly_report (mes: ${{ env.REPORT_MONTH }})"
          echo "   → GitHub:   reports/${{ env.REPORT_MONTH }}.md"
          echo "   → URL:      https://raw.githubusercontent.com/jfosela81/cava-trader/main/reports/${{ env.REPORT_MONTH }}.md"
          echo "   → Latest:   https://raw.githubusercontent.com/jfosela81/cava-trader/main/reports/latest.md"
